
name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Laravel Tests
    runs-on: ubuntu-latest

    # Temporary MySQL database for CI
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: rohitdb
          MYSQL_USER: laravel
          MYSQL_PASSWORD: laravel_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Laravel database configuration
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rohitdb
      DB_USERNAME: laravel
      DB_PASSWORD: laravel_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_mysql, bcmath, curl
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Clear cached configuration
        run: php artisan config:clear

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        env:
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test
